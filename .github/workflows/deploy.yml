name: Deploy

# Runs on every push to main. Uses OIDC, so no AWS access keys are stored.
on:
  push:
    branches: [main]

permissions:
  id-token: write # lets the job request an OIDC token from GitHub
  contents: read

# Never run two deploys at once (Terraform state also has a lock file).
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
      TF_VAR_demo_password: ${{ secrets.DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.11"
          terraform_wrapper: false # keeps `terraform output -raw` clean for the scripts

      # 1. Build the Lambda binary
      - name: Build Lambda
        run: sh infra/build-lambda.sh

      # 2. Apply infrastructure
      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve -input=false

      # 3. Build and upload the dashboard
      #    (deploy-dashboard.sh runs `bun run build` but not `bun install`)
      - name: Install dashboard dependencies
        working-directory: campus-pulse-dashboard
        run: bun install

      - name: Deploy dashboard
        run: sh infra/deploy-dashboard.sh

      # 4. Check that the API's /health endpoint responds
      - name: Health check
        working-directory: infra
        run: |
          API_URL=$(terraform output -raw api_url)
          echo "Checking $API_URL/health"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$API_URL/health"
